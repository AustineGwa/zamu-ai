<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head><title>Test run · Zamu</title></head>
<body>
<main id="main" class="mx-auto max-w-6xl px-4 py-6">
    <div th:replace="~{fragments/wizard :: header}"></div>
    <a th:href="@{/admin/tenants/{id}/eval(id=${tenant.id})}" class="link text-sm">Evaluation set</a>

    <!-- Polls every 3 seconds until the run is done. -->
    <section th:fragment="progress" id="progress" class="mt-3 space-y-4"
             th:attr="hx-get=${run.finished()} ? null : @{/admin/tenants/{id}/eval/{rid}/progress(id=${tenant.id}, rid=${run.id()})},
                      hx-trigger=${run.finished()} ? null : 'every 3s',
                      hx-swap=${run.finished()} ? null : 'outerHTML'">
        <div class="card flex flex-wrap items-center justify-between gap-3">
            <div>
                <h2 class="text-lg font-semibold">
                    Run of <span th:text="${T(ai.zamu.shared.time.ZamuTime).display(run.createdAt())}">Wed 14 Oct, 09:00</span>
                </h2>
                <p class="text-sm text-ink-600" th:if="${run.model() != null}" th:text="'Model: ' + ${run.model()}">Model</p>
            </div>
            <div th:if="${run.finished()}" class="text-right">
                <p class="font-display text-3xl font-semibold" th:text="${run.percent()} + '%'">96%</p>
                <p class="text-sm" th:text="${run.passed()} + ' of ' + ${run.total()} + ' passed · ' + ${run.trapFailures()} + ' trap failures'">48 of 50</p>
                <p th:if="${run.meetsBar()}" class="badge mt-1 bg-brand-50 text-brand-800">Meets the bar</p>
                <p th:unless="${run.meetsBar()}" class="badge mt-1 bg-danger-50 text-danger-700">Below the bar: 95% and no trap failures</p>
            </div>
            <p th:unless="${run.finished()}" class="badge" th:text="${#lists.size(results)} + ' answered so far…'">Running</p>
        </div>

        <div class="relative overflow-x-auto rounded-lg border border-gray-200 bg-white">
            <table class="table-basic min-w-[48rem]">
                <thead>
                <tr><th scope="col">Result</th><th scope="col">Question</th><th scope="col">Expected</th><th scope="col">Zamu's answer</th></tr>
                </thead>
                <tbody>
                <tr th:each="r : ${results}">
                    <td>
                        <span th:if="${r.passed()}" class="badge bg-brand-50 text-brand-800">Pass</span>
                        <span th:unless="${r.passed()}" class="badge bg-danger-50 text-danger-700">Fail</span>
                        <p th:if="${r.reason() != null}" class="mt-1 text-xs text-ink-600" th:text="${r.reason()}">reason</p>
                    </td>
                    <td>
                        <span th:text="${r.question()}">Question</span>
                        <span class="block text-xs text-ink-600" th:text="${r.kind().label()} + ' · ' + ${r.language()}">Answer · en</span>
                    </td>
                    <td class="text-sm text-ink-700">
                        <span th:text="${r.expectedAnswer() != null} ? ${r.expectedAnswer()} : ${r.kind().passWhen()}">Expected</span>
                        <span th:if="${r.mustInclude() != null}" class="block text-xs" th:text="'Must include: ' + ${r.mustInclude()}"></span>
                    </td>
                    <td class="whitespace-pre-wrap text-sm" th:text="${r.reply()}">Reply</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
