<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head><title>Move booking · Zamu</title></head>
<body>
<main id="main" class="mx-auto max-w-3xl px-4 py-6">
    <a th:href="@{/app/bookings}" class="link text-sm">All bookings</a>
    <h1 class="mt-2 text-2xl font-semibold">Move booking</h1>
    <div class="mt-4" th:insert="~{fragments/forms :: flash}"></div>
    <p class="mt-2 text-ink-700">
        <span th:text="${booking.serviceName()}">Check-up</span> for
        <span th:text="${booking.customerName() != null ? booking.customerName() : '+' + booking.customerPhone()}">Wanjiku</span>,
        now <strong th:text="${#temporals.format(booking.startsAt().atZone(zone), 'EEE d MMM, HH:mm')}">Sat 18 Oct, 09:30</strong>.
    </p>
    <form th:action="@{'/app/bookings/' + ${booking.id()} + '/move'}" method="post" class="card mt-4 space-y-5">
        <div th:attr="hx-get=@{/app/bookings/slots}, hx-trigger='change', hx-target='#slots', hx-swap='outerHTML', hx-include='this'">
            <input type="hidden" name="serviceId" th:value="${booking.serviceId()}">
            <input type="hidden" name="moving" th:value="${booking.id()}">
            <label for="date" class="field-label">New day</label>
            <input id="date" type="date" name="date" th:value="${day}" class="field-input max-w-xs">
        </div>
        <div id="slots" th:attr="hx-get=@{/app/bookings/slots(serviceId=${booking.serviceId()}, date=${day}, moving=${booking.id()})}, hx-trigger='load', hx-swap='outerHTML'">
            <p class="text-sm text-ink-600">Loading free times…</p>
        </div>
        <button type="submit" class="btn-primary">Move booking</button>
    </form>
</main>
</body>
</html>
