<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head><title>New booking · Zamu</title></head>
<body>
<main id="main" class="mx-auto max-w-3xl px-4 py-6">
    <a th:href="@{/app/bookings}" class="link text-sm">All bookings</a>
    <h1 class="mt-2 text-2xl font-semibold">New booking</h1>
    <p th:if="${#lists.isEmpty(services)}" class="card mt-4 text-ink-700">
        There are no bookable services yet. Ask the Zamu team to add your services.
    </p>
    <form th:if="${!#lists.isEmpty(services)}" th:action="@{/app/bookings}" th:object="${form}" method="post"
          class="card mt-4 space-y-5" novalidate>
        <div th:replace="~{fragments/forms :: globalErrors}"></div>
        <div class="grid gap-4 sm:grid-cols-2">
            <div>
                <label for="phone" class="field-label">Customer's phone</label>
                <input id="phone" th:field="*{phone}" inputmode="tel" class="field-input" placeholder="0712 345 678"
                       th:attr="aria-invalid=${#fields.hasErrors('phone')} ? 'true' : null">
                <p th:if="${#fields.hasErrors('phone')}" class="field-error" th:errors="*{phone}"></p>
            </div>
            <div>
                <label for="name" class="field-label">Name</label>
                <input id="name" th:field="*{name}" class="field-input">
            </div>
        </div>
        <div class="grid gap-4 sm:grid-cols-2"
             th:attr="hx-get=@{/app/bookings/slots}, hx-trigger='change', hx-target='#slots', hx-swap='outerHTML', hx-include='this'">
            <div>
                <label for="serviceId" class="field-label">Service</label>
                <select id="serviceId" th:field="*{serviceId}" class="field-input">
                    <option value="">Choose…</option>
                    <option th:each="s : ${services}" th:value="${s.id()}" th:text="${s.name()} + ' (' + ${s.durationMin()} + ' min)'">Check-up</option>
                </select>
                <p th:if="${#fields.hasErrors('serviceId')}" class="field-error" th:errors="*{serviceId}"></p>
            </div>
            <div>
                <label for="date" class="field-label">Day</label>
                <input id="date" type="date" th:field="*{date}" th:attr="min=${today}" class="field-input">
            </div>
        </div>
        <div th:replace="~{bookings/slots :: slots}"></div>
        <p th:if="${#fields.hasErrors('slot')}" class="field-error" th:errors="*{slot}"></p>
        <div>
            <label for="notes" class="field-label">Notes <span class="font-normal text-ink-600">(optional, no health details)</span></label>
            <input id="notes" th:field="*{notes}" class="field-input">
        </div>
        <button type="submit" class="btn-primary">Save booking</button>
    </form>
</main>
</body>
</html>
