<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head><title>Tenants · Zamu admin</title></head>
<body>
<main id="main" class="mx-auto max-w-6xl space-y-6 px-4 py-6">
    <div>
        <h1 class="text-2xl font-semibold">Tenants</h1>
        <p class="text-sm text-ink-600">Every client business Zamu runs for. Usage, handovers and health arrive with later milestones.</p>
    </div>
    <div th:replace="~{fragments/forms :: flash}"></div>

    <div class="grid gap-6 lg:grid-cols-[2fr_1fr]">
        <section class="card overflow-hidden p-0 sm:p-0" aria-labelledby="tenants-heading">
            <h2 id="tenants-heading" class="px-5 pt-5 text-lg font-semibold sm:px-6">All tenants</h2>
            <p th:if="${#lists.isEmpty(tenants)}" class="px-5 pb-5 pt-2 text-sm text-ink-600 sm:px-6">No tenants yet. Create the first one.</p>
            <ul th:unless="${#lists.isEmpty(tenants)}" class="mt-3 divide-y divide-gray-100">
                <li th:each="t : ${tenants}">
                    <a th:href="@{/admin/tenants/{id}/setup/profile(id=${t.id})}"
                       class="flex flex-wrap items-center justify-between gap-2 px-5 py-4 hover:bg-gray-50 sm:px-6">
                        <span class="min-w-0">
                            <span class="block font-medium" th:text="${t.displayName}">Afya Clinic</span>
                            <span class="block truncate text-sm text-ink-600" th:text="${t.name}">Afya Clinic Ltd</span>
                        </span>
                        <span class="flex gap-2">
                            <span class="badge" th:text="${t.plan.label()}">Starter</span>
                            <span class="badge" th:text="${t.status.label()}">Onboarding</span>
                        </span>
                    </a>
                </li>
            </ul>
        </section>

        <section class="card" aria-labelledby="create-heading">
            <h2 id="create-heading" class="text-lg font-semibold">New tenant</h2>
            <form th:action="@{/admin/tenants}" th:object="${form}" method="post" class="mt-4 space-y-4" novalidate>
                <div th:replace="~{fragments/forms :: globalErrors}"></div>
                <div>
                    <label for="name" class="field-label">Registered business name</label>
                    <input type="text" th:field="*{name}" class="field-input"
                           th:attr="aria-invalid=${#fields.hasErrors('name')},aria-describedby=${#fields.hasErrors('name')} ? 'name-error' : null">
                    <p th:if="${#fields.hasErrors('name')}" id="name-error" class="field-error" th:errors="*{name}">Error</p>
                </div>
                <div>
                    <label for="displayName" class="field-label">Name customers use</label>
                    <input type="text" th:field="*{displayName}" class="field-input"
                           th:attr="aria-invalid=${#fields.hasErrors('displayName')},aria-describedby=${#fields.hasErrors('displayName')} ? 'displayName-error' : null">
                    <p th:if="${#fields.hasErrors('displayName')}" id="displayName-error" class="field-error" th:errors="*{displayName}">Error</p>
                </div>
                <div>
                    <label for="plan" class="field-label">Plan</label>
                    <select th:field="*{plan}" class="field-input">
                        <option th:each="p : ${plans}" th:value="${p}"
                                th:text="${p.label()} + ' · ' + ${#numbers.formatInteger(p.conversationsPerMonth(), 1, 'COMMA')} + ' conversations'">Starter</option>
                    </select>
                    <p th:if="${#fields.hasErrors('plan')}" class="field-error" th:errors="*{plan}">Error</p>
                </div>
                <button type="submit" class="btn-primary w-full">Create and start setup</button>
            </form>
        </section>
    </div>
</main>
</body>
</html>
