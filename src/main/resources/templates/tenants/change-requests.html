<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head><title>Change requests · Admin · Zamu</title></head>
<body>
<main id="main" class="mx-auto max-w-5xl px-4 py-6">
    <div class="flex flex-wrap items-end justify-between gap-3">
        <h1 class="text-2xl font-semibold">Change requests</h1>
        <a th:href="@{/admin/change-requests(open=${!openOnly})}" class="link text-sm"
           th:text="${openOnly} ? 'Show closed too' : 'Show open only'">Show closed too</a>
    </div>
    <div class="mt-4" th:insert="~{fragments/forms :: flash}"></div>
    <p th:if="${#lists.isEmpty(requests)}" class="card mt-4 text-ink-700">Nothing waiting.</p>
    <ul th:if="${!#lists.isEmpty(requests)}" class="mt-4 space-y-3">
        <li th:each="r : ${requests}" class="card">
            <div class="flex flex-wrap items-center gap-2 text-sm">
                <a class="font-semibold link" th:href="@{'/admin/tenants/' + ${r.tenantId()} + '/kb'}" th:text="${r.tenantName()}">Afya Clinic</a>
                <span th:text="${r.type().label()}">Knowledge base answer</span>
                <span class="text-ink-600" th:text="${T(ai.zamu.shared.time.ZamuTime).display(r.createdAt())}">14 Oct</span>
                <span th:unless="${r.open()}" class="badge bg-gray-100 text-ink-700" th:text="${r.status()}">done</span>
            </div>
            <p class="mt-2 whitespace-pre-line" th:text="${r.details()}">Details</p>
            <p th:if="${r.note() != null}" class="mt-1 text-sm text-ink-700" th:text="'Note: ' + ${r.note()}">Note</p>
            <form th:if="${r.open()}" th:action="@{'/admin/change-requests/' + ${r.id()} + '/close'}" method="post"
                  class="mt-3 flex flex-wrap items-end gap-2">
                <label class="grow text-sm"><span class="field-label">Note to the owner (optional)</span>
                    <input name="note" maxlength="500" class="field-input"></label>
                <button type="submit" name="done" value="true" class="btn-primary">Mark done</button>
                <button type="submit" name="done" value="false" class="btn-secondary">Decline</button>
            </form>
        </li>
    </ul>
</main>
</body>
</html>
