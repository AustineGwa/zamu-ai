<!DOCTYPE html>
<!--
  Tenant setup wizard navigation (spec: Admin console, Tenant setup wizard).
  Needs model attributes: tenant (TenantView), step (current step key).
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="header" class="mb-6 space-y-4">
    <div>
        <a th:href="@{/admin/tenants}" class="text-sm font-medium text-brand-700 underline underline-offset-2">All tenants</a>
        <h1 class="mt-1 text-2xl font-semibold" th:text="${tenant.displayName}">Tenant</h1>
        <p class="text-sm text-ink-600">
            <span th:text="${tenant.plan.label()}">Starter</span> plan ·
            <span th:text="${tenant.status.label()}">Onboarding</span>
        </p>
    </div>
    <nav aria-label="Setup steps" class="-mx-4 overflow-x-auto px-4">
        <!-- key | label | path under /admin/tenants/{id}. Later-milestone steps say where they will be built. -->
        <ol class="flex min-w-max gap-1 text-sm"
            th:with="steps=${ {'profile|Profile|setup/profile', 'whatsapp|WhatsApp|setup/whatsapp', 'hours|Hours|setup/hours',
                               'services|Services|setup/services', 'calendar|Calendar|setup/calendar', 'mpesa|M-Pesa|setup/mpesa',
                               'tone|Tone and safety|setup/tone', 'kb|Knowledge|kb', 'eval|Tests|eval', 'staff|Staff|setup/staff',
                               'go-live|Go-live|setup/go-live', 'privacy|Privacy and data|privacy'} }">
            <li th:each="entry, iter : ${steps}" th:with="parts=${#strings.arraySplit(entry, '|')}">
                <a th:href="@{'/admin/tenants/' + ${tenant.id} + '/' + ${parts[2]}}"
                   th:attr="aria-current=${parts[0] == step} ? 'step' : null"
                   th:classappend="${parts[0] == step} ? 'bg-brand-700 text-white' : 'bg-white text-ink-900 hover:bg-gray-100'"
                   class="block rounded-md border border-gray-200 px-3 py-2 font-medium">
                    <span th:text="${iter.count} + '. ' + ${parts[1]}">1. Profile</span>
                </a>
            </li>
        </ol>
    </nav>
</div>
</body>
</html>
