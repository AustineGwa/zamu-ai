<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head><title>Staff · Zamu</title></head>
<body>
<main id="main" class="mx-auto max-w-6xl space-y-6 px-4 py-6">
    <div>
        <h1 class="text-2xl font-semibold">Staff logins</h1>
        <p class="text-sm text-ink-600">Everyone who replies to customers needs their own login. Disabling a login signs that person out at once.</p>
    </div>
    <div th:replace="~{fragments/forms :: flash}"></div>
    <div class="grid gap-6 lg:grid-cols-[2fr_1fr]">
        <section th:replace="~{users/fragments :: userTable('/app/users')}"></section>
        <section th:replace="~{users/fragments :: addUserForm(@{/app/users})}"></section>
    </div>
</main>
</body>
</html>
