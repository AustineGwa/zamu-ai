<!DOCTYPE html>
<!-- Pieces shared by the owner's Staff page and the admin wizard's staff step. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Needs: users (List<UserView>), disableBase (URL prefix for POST .../{id}/disable). -->
<section th:fragment="userTable(disableBase)" class="card overflow-hidden p-0 sm:p-0" aria-labelledby="users-heading">
    <h2 id="users-heading" class="px-5 pt-5 text-lg font-semibold sm:px-6">Logins</h2>
    <p th:if="${#lists.isEmpty(users)}" class="px-5 pb-5 pt-2 text-sm text-ink-600 sm:px-6">No logins yet.</p>
    <ul th:unless="${#lists.isEmpty(users)}" class="mt-3 divide-y divide-gray-100">
        <li th:each="u : ${users}" class="flex flex-wrap items-center justify-between gap-3 px-5 py-4 sm:px-6">
            <div class="min-w-0">
                <p class="font-medium">
                    <span th:text="${u.name}">Jane Wanjiku</span>
                    <span class="badge ml-1" th:text="${u.role.label()}">Staff</span>
                    <span class="badge ml-1 bg-danger-50 text-danger-700" th:unless="${u.active()}">Disabled</span>
                </p>
                <p class="truncate text-sm text-ink-600" th:text="${u.email}">jane@example.com</p>
                <p class="text-xs text-ink-600">
                    Last sign-in:
                    <span th:text="${u.lastLoginAt != null} ? ${T(ai.zamu.shared.time.ZamuTime).display(u.lastLoginAt)} : 'never'">never</span>
                </p>
            </div>
            <form th:if="${u.active() and (currentUser == null or u.id != currentUser.userId)}"
                  th:action="@{__${disableBase}__/{id}/disable(id=${u.id})}" method="post">
                <button type="submit" class="btn-danger">
                    Disable<span class="sr-only" th:text="' ' + ${u.name}"></span>
                </button>
            </form>
        </li>
    </ul>
</section>

<!-- Needs: form (CreateUserRequest), roles. -->
<section th:fragment="addUserForm(action)" class="card" aria-labelledby="add-heading">
    <h2 id="add-heading" class="text-lg font-semibold">Add a login</h2>
    <form th:action="${action}" th:object="${form}" method="post" class="mt-4 space-y-4" novalidate>
        <div th:replace="~{fragments/forms :: globalErrors}"></div>
        <div>
            <label for="name" class="field-label">Name</label>
            <input type="text" th:field="*{name}" class="field-input" autocomplete="off"
                   th:attr="aria-invalid=${#fields.hasErrors('name')},aria-describedby=${#fields.hasErrors('name')} ? 'name-error' : null">
            <p th:if="${#fields.hasErrors('name')}" id="name-error" class="field-error" th:errors="*{name}">Error</p>
        </div>
        <div>
            <label for="email" class="field-label">Email address</label>
            <input type="email" th:field="*{email}" class="field-input" autocomplete="off" inputmode="email"
                   th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email')} ? 'email-error' : 'email-hint'">
            <p id="email-hint" class="field-hint">They sign in with this email. Each person needs their own.</p>
            <p th:if="${#fields.hasErrors('email')}" id="email-error" class="field-error" th:errors="*{email}">Error</p>
        </div>
        <fieldset>
            <legend class="field-label">Role</legend>
            <div class="flex flex-wrap gap-4">
                <label th:each="r : ${roles}" class="flex items-center gap-2 text-sm">
                    <input type="radio" th:field="*{role}" th:value="${r}" class="h-4 w-4 accent-brand-700">
                    <span th:text="${r.label()}">Staff</span>
                </label>
            </div>
            <p class="field-hint">Owners also manage logins and see reports.</p>
            <p th:if="${#fields.hasErrors('role')}" class="field-error" th:errors="*{role}">Error</p>
        </fieldset>
        <button type="submit" class="btn-primary">Add login</button>
    </form>
</section>

</body>
</html>
