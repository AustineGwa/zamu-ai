<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head><title>Authenticator code · Zamu</title></head>
<body>
<main id="main" class="mx-auto flex max-w-md flex-col px-4 pt-12 sm:pt-20">
    <div class="card">
        <h1 class="text-xl font-semibold">Authenticator code</h1>
        <p class="mt-1 text-sm text-ink-600">Zamu team accounts need a second step. Enter the 6-digit code from your authenticator app.</p>

        <form th:action="@{/login/totp}" th:object="${form}" method="post" class="mt-5 space-y-4" novalidate>
            <div>
                <label for="code" class="field-label">Code from your app</label>
                <input type="text" th:field="*{code}" class="field-input text-center text-2xl tracking-[0.4em]"
                       inputmode="numeric" autocomplete="one-time-code" maxlength="7" autofocus required
                       th:attr="aria-invalid=${#fields.hasErrors('code')},aria-describedby=${#fields.hasErrors('code')} ? 'code-error' : null">
                <p th:if="${#fields.hasErrors('code')}" id="code-error" class="field-error" th:errors="*{code}">Error</p>
            </div>
            <button type="submit" class="btn-primary w-full">Continue</button>
        </form>
        <p class="mt-4 text-sm text-ink-600">Lost your phone? Ask a Zamu admin to reset your second factor.</p>
    </div>
</main>
</body>
</html>
