<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head><title>Staff · Setup · Zamu</title></head>
<body>
<main id="main" class="mx-auto max-w-6xl px-4 py-6">
    <div th:replace="~{fragments/wizard :: header}"></div>
    <div class="space-y-6">
        <div th:replace="~{fragments/forms :: flash}"></div>
        <p class="text-sm text-ink-600">
            Add the owner and the staff who will take handovers. The plan includes
            <strong th:text="${loginLimit}">2</strong> logins; the Zamu team can go over this here, owners can't.
        </p>
        <div class="grid gap-6 lg:grid-cols-[2fr_1fr]">
            <section th:replace="~{users/fragments :: userTable('/admin/tenants/' + ${tenant.id} + '/setup/staff')}"></section>
            <section th:replace="~{users/fragments :: addUserForm(@{/admin/tenants/{id}/setup/staff(id=${tenant.id})})}"></section>
        </div>
    </div>
</main>
</body>
</html>
